[project]
name = "crewai-agentcoin"
version = "0.1.0"
description = "AgentCoin tools for CrewAI. Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STOS Technologies LLC" }]
dependencies = ["agentcoin-core==0.1.0", "crewai>=0.100", "pydantic>=2"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_agentcoin"]
