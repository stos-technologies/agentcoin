[project]
name = "openai-agents-agentcoin"
version = "0.1.0"
description = "AgentCoin tools for the OpenAI Agents SDK (Python). Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STOS Technologies LLC" }]
dependencies = ["agentcoin-core==0.1.0", "openai-agents>=0.2"]
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/stos-technologies/agentcoin"
Repository = "https://github.com/stos-technologies/agentcoin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcoin_openai_agents"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
