[project]
name = "langchain-agentcoin"
version = "0.1.0"
description = "AgentCoin tools for LangChain and LangGraph. Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["agentcoin-core==0.1.0", "langchain-core>=0.3"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
test = ["langgraph>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agentcoin"]
