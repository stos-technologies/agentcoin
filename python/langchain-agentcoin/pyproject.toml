[project]
name = "langchain-agentkoin"
version = "0.1.0"
description = "AgentKoin (formerly AgentCoin) tools for LangChain and LangGraph. Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STOS Technologies LLC" }]
dependencies = ["agentkoin-core==0.1.0", "langchain-core>=0.3"]

[project.optional-dependencies]
test = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/stos-technologies/agentcoin"
Repository = "https://github.com/stos-technologies/agentcoin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agentcoin"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
