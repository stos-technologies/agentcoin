[project]
name = "agentcoin-core"
version = "0.1.0"
description = "AgentCoin router client (find, order, pay, verify). Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "eth-account>=0.13", "eth-abi>=5", "web3>=7", "rfc8785>=0.1.4"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcoin_core"]
