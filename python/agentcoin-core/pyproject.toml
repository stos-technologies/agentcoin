[project]
name = "agentcoin-core"
version = "0.1.0"
description = "AgentCoin router client (find, order, pay, verify). Base Sepolia testnet only."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STOS Technologies LLC" }]
dependencies = ["httpx>=0.27", "eth-account>=0.13", "eth-abi>=5", "web3>=7", "rfc8785>=0.1.4"]
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/stos-technologies/agentcoin"
Repository = "https://github.com/stos-technologies/agentcoin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcoin_core"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
